name: Staging Smoke Test

# MANUAL TRIGGER ONLY (workflow_dispatch via GitHub Actions UI).
#
# The automatic `push`-to-main trigger was removed: these tests submit real
# forms against the Vercel preview deployment, and all Google Sheets writes
# and Resend emails happen SERVER-SIDE using the preview deployment's own
# Vercel environment variables — not the STAGING_* secrets below (those only
# feed the test process's assertions). Auto-running on every merge risked
# polluting the production sheet until the preview env is verified.
# Re-adding `push:` triggers is safe only after confirming the
# `preview-ugle-cf` deployment points at the TEST spreadsheet.
on:
  workflow_dispatch:
    inputs:
      form:
        description: "Form to test"
        type: choice
        required: true
        options:
          - newsletter
          - contact
          - demo
          - early_access
          - education
          - all
        default: "newsletter"

concurrency:
  group: staging-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_TEST_BASE_URL: "https://preview-ugle-cf.vercel.app"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.STAGING_TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.STAGING_TURNSTILE_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.STAGING_RESEND_FROM_EMAIL }}
      ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.STAGING_GOOGLE_SPREADSHEET_ID }}
      GOOGLE_CLIENT_EMAIL: ${{ secrets.STAGING_GOOGLE_CLIENT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.STAGING_GOOGLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright (Chromium only)
        run: bunx playwright install --with-deps chromium

      - name: Run Staging Smoke Tests
        run: |
          FORM="${{ github.event.inputs.form || 'newsletter' }}"
          if [ "$FORM" = "all" ]; then
            bun run test:e2e --project=chromium
          elif [ "$FORM" = "early_access" ]; then
            bun run test:e2e --project=chromium --grep "Early Access"
          else
            bun run test:e2e --project=chromium --grep "$FORM"
          fi

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-staging-smoke-report
          path: playwright-report/
          retention-days: 14
