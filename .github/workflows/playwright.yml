name: CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Typecheck TypeScript
        run: bunx tsc --noEmit

  unit-and-action-tests:
    name: Unit & Server Action Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Vitest Unit Tests
        run: bun run test

  e2e-tests:
    name: Playwright E2E Tests (Chromium & WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, unit-and-action-tests]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ugle
          POSTGRES_PASSWORD: ugle
          POSTGRES_DB: ugle
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
      RESEND_API_KEY: "re_test_mock_pipeline_key"
      RESEND_FROM_EMAIL: "onboarding@ugle.ai"
      ADMIN_EMAIL: "ci@ugle.ai"
      # Payload needs a reachable database and a secret at build time.
      DATABASE_URL: "postgres://ugle:ugle@localhost:5432/ugle"
      PAYLOAD_SECRET: "ci-payload-secret"
      PREVIEW_SECRET: "ci-preview-secret"
      CRON_SECRET: "ci-cron-secret"
      NEXT_PUBLIC_SERVER_URL: "http://localhost:3000"
      SEED_ADMIN_EMAIL: "admin@ugle.ai"
      SEED_ADMIN_PASSWORD: "Admin123!@#"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Browsers (Chromium & WebKit for macOS audience)
        run: bunx playwright install --with-deps chromium webkit

      - name: Run database migrations
        run: bun run migrate

      - name: Seed categories, authors, answers and the demo post
        run: bun run seed

      - name: Build Next.js Application
        run: bun run build

      - name: Run Playwright E2E Tests
        run: bun run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  integration-tests:
    name: Payload Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ugle
          POSTGRES_PASSWORD: ugle
          POSTGRES_DB: ugle
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The suite creates this database (idempotently) before running.
      TEST_DATABASE_URL: "postgres://ugle:ugle@localhost:5432/ugle_test"
      PAYLOAD_SECRET: "ci-integration-secret"
      PREVIEW_SECRET: "ci-preview-secret"
      CRON_SECRET: "ci-cron-secret"
      NEXT_PUBLIC_SERVER_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Payload integration tests
        run: bun run test:integration
